name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sin gate de cobertura: el coverage se reporta como información,
# no rompe el build (decisión documentada en CLAUDE.md, sección 3).
jobs:
  tests:
    name: tests (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Job extra: validar que el entorno real de desarrollo (Windows)
          # también pasa. Una sola versión de Python para no inflar el matrix.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + extras dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint con ruff (solo tests/)
        # El código de src/ tiene findings preexistentes de UP006/UP035/UP045
        # (typing legacy) e I001 (orden de imports) que requieren una pasada
        # de modernización dedicada. Hasta entonces, lint solo de tests/.
        run: ruff check tests

      - name: Pytest con cobertura
        run: >
          pytest -ra
          --cov=src/riskpkg
          --cov-report=term-missing
          --cov-report=xml

      - name: Subir cobertura como artefacto
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
